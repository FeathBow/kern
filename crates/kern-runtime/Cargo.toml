[package]
name = "kern-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
kern-manifest = { path = "../kern-manifest" }
cudarc = { version = "=0.19.7", features = ["cuda-version-from-build-system", "f16"] }
half = "=2.7.1"
safetensors = "=0.7.0"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]

[[bin]]
name = "kern-run"
path = "src/bin/kern-run.rs"

[dependencies.tokenizers]
version = "=0.22.2"
