[package]
name = "kern-serve"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible serving over a kern manifest: a continuous-batching scheduler behind the pegainfer frontend"

# Its own workspace, on purpose: the serving stack (pegainfer frontend, vLLM
# Rust server crates) stays out of the runtime's dependency graph and CI.
[workspace]

[dependencies]
kern-manifest = { path = "../kern-manifest" }
kern-runtime = { path = "../kern-runtime" }
kern-run = { path = "../kern-run" }
# Sibling checkout during development (pegainfer-project/pegainfer).
pegainfer-frontend = { path = "../../../pegainfer/pegainfer-frontend" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "kern-serve"
path = "src/main.rs"
